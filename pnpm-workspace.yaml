packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks lifecycle scripts by default. Only allow the packages that need
# to build or fetch native binaries.
allowBuilds:
  '@nomicfoundation/edr': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@swc/core-darwin-arm64@1.16.22'
  - '@swc/core-darwin-x64@1.16.22'
  - '@swc/core-linux-arm-gnueabihf@1.16.22'
  - '@swc/core-linux-arm64-gnu@1.16.22'
  - '@swc/core-linux-arm64-musl@1.16.22'
  - '@swc/core-linux-ppc64-gnu@1.16.22'
  - '@swc/core-linux-s390x-gnu@1.16.22'
  - '@swc/core-linux-x64-gnu@1.16.22'
  - '@swc/core-linux-x64-musl@1.16.22'
  - '@swc/core-win32-arm64-msvc@1.16.22'
  - '@swc/core-win32-ia32-msvc@1.16.22'
  - '@swc/core-win32-x64-msvc@1.16.22'
  - '@swc/core@1.16.22'
