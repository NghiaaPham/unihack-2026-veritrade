services:
  postgres:
    image: postgres:17-alpine
    container_name: veritrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veritrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritrade}
      POSTGRES_DB: ${POSTGRES_DB:-veritrade}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-veritrade} -d ${POSTGRES_DB:-veritrade}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
